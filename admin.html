body{

button,input,textarea,select{font-family:inherit}

button{
    border:0;
    border-radius:9px;
    padding:12px 17px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{opacity:.9}

input,textarea,select{

    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    padding:13px;
    outline:none;
    font-size:14px;
}

input:focus,textarea:focus,select:focus{

}

textarea{
    min-height:100px;
    resize:vertical;
}

label{
    display:block;
    color:#bbb;
    font-size:14px;
    margin-bottom:7px;
}

.btn-red{background:#e50914;color:#fff}
.btn-dark{background:#292929;color:#fff}
.btn-danger{background:#b00020;color:#fff}
.btn-green{background:#16803c;color:#fff}
.btn-small{padding:8px 11px;font-size:12px}

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle at top,#241010,#070707 45%);
}

.login-box{
    width:100%;
    max-width:400px;
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:30px;
    box-shadow:0 20px 60px #000;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    color:#e50914;
    margin-bottom:8px;
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{margin-bottom:16px}

.error{

    margin-top:12px;

}

#adminPanel{display:none}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:#0d0d0d;
    border-bottom:1px solid #252525;
    padding:15px 20px;
}

.topbar-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    font-size:22px;
    font-weight:900;
    color:#e50914;
}

.brand span{color:#fff}

.main{
    max-width:1400px;
    margin:auto;

}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#111;
    border:1px solid #252525;
    border-radius:14px;
    padding:20px;

.stat small{color:#888}

.stat strong{

.tabs{

.tab{
    background:#181818;
    color:#aaa;
}

.tab.active{
    background:#e50914;
    color:#fff;
}

.section{display:none}
.section.active{display:block}

.card{
    background:#111;
    border:1px solid #252525;
    border-radius:15px;
    padding:22px;
    margin-bottom:20px;
}

.card-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;

.full{grid-column:1/-1}

.social-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.check-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:10px;
}

.check{
    display:flex;
    align-items:center;
    gap:8px;
    background:#181818;
    border-radius:8px;
    padding:12px;
    color:#ddd;

.check input{width:auto}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;

.search{margin-bottom:15px}

.list{
    display:grid;
    gap:12px;

.item{

    border:1px solid #292929;
    border-radius:12px;
    padding:16px;

.item h3{margin-bottom:6px}

.item p{

    line-height:1.5;
    font-size:14px;
}

.item-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:13px;
}

.badges{

    gap:5px;
    flex-wrap:wrap;
    margin-top:10px;

.badge{

    color:#ccc;

    border-radius:5px;
    font-size:11px;

.badge.red{
    background:#e50914;
    color:#fff;
}

.badge.green{
    background:#16803c;
    color:#fff;

.empty{
    text-align:center;
    padding:35px;
    color:#777;

.modal{
    position:fixed;
    inset:0;
    background:#000c;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;

.modal.show{display:flex}

.modal-box{
    width:100%;
    max-width:800px;
    max-height:90vh;
    overflow:auto;
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    padding:22px;

.modal-head{

    margin-bottom:20px;

.close{

    color:#fff;

    width:40px;
    height:40px;
    padding:0;

/* =====================================================

async function loadAll(){

const artistResult =
await supabaseClient
.from("artists")
.select("*")
.order("created_at",{ascending:true});

if(artistResult.error)
throw artistResult.error;


/*
Si no existen artistas,
los crea automáticamente.
*/

if(
!artistResult.data ||
artistResult.data.length===0
){

await seedInitialArtists();

await supabaseClient
.from("artists")

async function seedInitialArtists(){

youtube:
"https://youtube.com/watch?v="+

}));

await supabaseClient

/* =====================================================
   NORMALIZAR
===================================================== */

function normalizeArtist(a){

return{

id:a.id,
name:a.name||"",
description:a.description||"",
image:a.image||"",
facebook:a.facebook||"",
instagram:a.instagram||"",
tiktok:a.tiktok||"",
youtube:a.youtube||"",
createdAt:a.created_at||""

};

}


function normalizeVideo(v){

return{

id:v.id,
artistId:v.artist_id,
title:v.title||"",
url:v.youtube_url||"",
description:v.description||"",
category:v.category||"",
popular:!!v.popular,
newRelease:!!v.new_release,
exclusive:!!v.exclusive,
featured:!!v.featured,
createdAt:v.created_at||""

};

}


/* =====================================================
   TABS

function showTab(id,button){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

button.classList.add("active");

}

const name =
document.getElementById("artistName")
.value.trim();

if(!name){

alert("Escribe el nombre del artista.");

return;

}


const artist={

name:name,

description:
document.getElementById("artistDescription")
.value.trim(),

image:
document.getElementById("artistImage")
.value.trim(),

facebook:
document.getElementById("facebook")
.value.trim(),

instagram:
document.getElementById("instagram")
.value.trim(),

tiktok:
document.getElementById("tiktok")
.value.trim(),

youtube:
document.getElementById("artistYoutube")
.value.trim()

};


const {error} =
await supabaseClient
.from("artists")
.insert([artist]);


if(error){

alert(
"❌ No se pudo guardar el artista.\n\n"+
error.message
);

return;

}


clearArtistForm();

await loadAll();

renderAll();

alert("✅ Artista guardado correctamente.");

}


/* =====================================================
   MOSTRAR ARTISTAS
===================================================== */

function renderArtists(){

const list =
document.getElementById("artistList");

const search =
(document.getElementById("artistSearch")?.value||"")
.toLowerCase();


const filtered =
artists.filter(a=>
a.name.toLowerCase().includes(search)
);


if(!filtered.length){

list.innerHTML=
'<div class="empty">No hay artistas.</div>';

return;

}


list.innerHTML =
filtered.map(a=>`

<div class="item">

<h3>${escapeHTML(a.name)}</h3>

<p>
${escapeHTML(
a.description||"Sin descripción"
)}
</p>

<div class="badges">

${a.facebook?
'<span class="badge">Facebook</span>':""}

${a.instagram?
'<span class="badge">Instagram</span>':""}

${a.tiktok?
'<span class="badge">TikTok</span>':""}

${a.youtube?
'<span class="badge red">YouTube</span>':""}

</div>


<div class="item-actions">

<button
class="btn-small btn-dark"
onclick="editArtist('${a.id}')"
>
✏️ Editar
</button>

<button
class="btn-small btn-danger"
onclick="deleteArtist('${a.id}')"
>
🗑️ Eliminar
</button>

</div>

</div>

`).join("");

}


/* =====================================================
   EDITAR ARTISTA
===================================================== */

function editArtist(id){

const a =
artists.find(x=>x.id===id);

if(!a)return;


document.getElementById("editArtistId").value=a.id;

document.getElementById("editArtistName").value=a.name;

document.getElementById("editArtistImage").value=a.image||"";

document.getElementById("editArtistDescription").value=a.description||"";

document.getElementById("editFacebook").value=a.facebook||"";

document.getElementById("editInstagram").value=a.instagram||"";

document.getElementById("editTikTok").value=a.tiktok||"";

document.getElementById("editArtistYoutube").value=a.youtube||"";


document.getElementById("editArtistModal")
.classList.add("show");

}


/* =====================================================
   ACTUALIZAR ARTISTA
===================================================== */

async function updateArtist(){

const id =
document.getElementById("editArtistId").value;


const updates={

name:
document.getElementById("editArtistName").value.trim(),

image:
document.getElementById("editArtistImage").value.trim(),

description:
document.getElementById("editArtistDescription").value.trim(),

facebook:
document.getElementById("editFacebook").value.trim(),

instagram:
document.getElementById("editInstagram").value.trim(),

tiktok:
document.getElementById("editTikTok").value.trim(),

youtube:
document.getElementById("editArtistYoutube").value.trim()

};


if(!updates.name){

alert("El nombre es obligatorio.");

return;

}


const {error} =
await supabaseClient
.from("artists")
.update(updates)
.eq("id",id);


if(error){

alert(
"❌ No se pudo actualizar.\n\n"+
error.message
);

return;

}


closeModal("editArtistModal");

await loadAll();

renderAll();

alert("✅ Artista actualizado.");

}


/* =====================================================
   ELIMINAR ARTISTA
===================================================== */

async function deleteArtist(id){

const artist =
artists.find(a=>a.id===id);

if(!artist)return;


if(!confirm(
"¿Eliminar a "+artist.name+
"?\n\nTambién se eliminarán sus videos."
))return;


const {error} =
await supabaseClient
.from("artists")
.delete()
.eq("id",id);


if(error){

alert(
"❌ No se pudo eliminar.\n\n"+
error.message
);

return;

}


await loadAll();

renderAll();

alert("🗑️ Artista eliminado.");

}


/* =====================================================
   LIMPIAR ARTISTA
===================================================== */

function clearArtistForm(){

[
"artistName",
"artistDescription",
"artistImage",
"facebook",
"instagram",
"tiktok",
"artistYoutube"
].forEach(id=>{
document.getElementById(id).value="";
});

}


/* =====================================================
   SELECT ARTISTAS
===================================================== */

function populateArtistSelects(){

const ids=[
"videoArtist",
"editVideoArtist"
];


ids.forEach(id=>{

const select =
document.getElementById(id);

if(!select)return;


const current=select.value;


select.innerHTML=
'<option value="">Seleccionar artista</option>';


artists
.slice()
.sort((a,b)=>
a.name.localeCompare(b.name,"es")
)
.forEach(a=>{

const option=
document.createElement("option");

option.value=a.id;

option.textContent=a.name;

select.appendChild(option);

});


if(current)
select.value=current;

});

}

/* =====================================================
   MOSTRAR VIDEOS
===================================================== */

function renderVideos(){

const list =
document.getElementById("videoList");

const search =
(document.getElementById("videoSearch")?.value||"")
.toLowerCase();


const filtered =
videos.filter(v=>{

const artist =
artists.find(a=>a.id===v.artistId);

const artistName =
artist?.name||"";

return(
v.title.toLowerCase().includes(search)||
artistName.toLowerCase().includes(search)
);

});


if(!filtered.length){

list.innerHTML=
'<div class="empty">No hay videos registrados.</div>';

return;

}


list.innerHTML =
filtered.slice().reverse().map(v=>{

const artist =
artists.find(a=>a.id===v.artistId);

const artistName =
artist?.name||"Artista eliminado";


return`

<div class="item">

<h3>
${escapeHTML(v.title)}
</h3>

<p>
🎤 ${escapeHTML(artistName)}
</p>

<p>
📂 ${escapeHTML(v.category)}
</p>

${v.description?
`<p style="margin-top:7px">
${escapeHTML(v.description)}
</p>`:""}


<div class="badges">

${v.popular?
'<span class="badge red">⭐ Popular</span>':""}

${v.newRelease?
'<span class="badge green">🆕 Nuevo</span>':""}

${v.exclusive?
'<span class="badge red">🔥 Exclusivo</span>':""}

${v.featured?
'<span class="badge">🎯 Destacado</span>':""}

</div>


<div class="item-actions">

<a
href="${escapeAttribute(v.url)}"
target="_blank"
rel="noopener"
class="btn-small btn-dark"
style="text-decoration:none"
>
▶️ Ver video
</a>

<button
class="btn-small btn-dark"
onclick="editVideo('${v.id}')"
>
✏️ Editar
</button>

<button
class="btn-small btn-danger"
onclick="deleteVideo('${v.id}')"
>
🗑️ Eliminar
</button>

</div>

</div>

`;

}).join("");

}

/* =====================================================
   MODAL
===================================================== */

function closeModal(id){

document.getElementById(id)
.classList.remove("show");

}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

function updateStats(){

document.getElementById("artistCount")
.textContent=artists.length;

document.getElementById("videoCount")
.textContent=videos.length;

document.getElementById("featuredCount")
.textContent=
videos.filter(v=>v.featured).length;

}


/* =====================================================
   SEGURIDAD
===================================================== */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value||"")
.replace(/"/g,"%22")
.replace(/'/g,"%27");

}


/* =====================================================
   RENDER
===================================================== */

function renderAll(){

populateArtistSelects();

renderArtists();

renderVideos();

updateStats();

}

.style.display="none";

.style.display="block";

}catch(error){

console.error(error);

sessionStorage.removeItem(
