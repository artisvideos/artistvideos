<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#070707;
    color:#fff;
}

/* LOGIN */
#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#241010 0%,#070707 45%);
}

.login-box{
    width:100%;
    max-width:400px;
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:30px;
    box-shadow:0 20px 60px #000;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    color:#e50914;
    margin-bottom:8px;
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:16px;
}

label{
    display:block;
    color:#bbb;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    background:#181818;
    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    padding:13px;
    outline:none;
    font-size:14px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#e50914;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 17px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

.btn-red{
    background:#e50914;
    color:#fff;
}

.btn-dark{
    background:#292929;
    color:#fff;
}

.btn-green{
    background:#16803c;
    color:#fff;
}

.btn-danger{
    background:#b00020;
    color:#fff;
}

.btn-small{
    padding:8px 11px;
    font-size:12px;
}

.error{
    color:#ff4d5a;
    text-align:center;
    margin-top:12px;
    display:none;
}

/* CONEXIÓN */
.connection-status{
    max-width:1400px;
    margin:15px auto 0;
    padding:0 20px;
}

.connection-box{
    padding:12px 15px;
    border-radius:9px;
    background:#181818;
    border:1px solid #333;
    color:#aaa;
    font-size:13px;
}

.connection-box.ok{
    color:#55d98b;
    border-color:#16803c;
}

.connection-box.error{
    display:block;
    color:#ff5c67;
    border-color:#b00020;
}

/* ADMIN */

.topbar{

    padding:15px 20px;

.card{

.form-grid{

.full{

.form-actions{

    gap:10px;

/* SOCIAL */
.social-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);

/* CHECKBOX */
.check-grid{

.check{

.check input{

/* SEARCH */

/* LIST */

/* =====================================================
   PETICIONES DIRECTAS A SUPABASE
===================================================== */

async function supabaseRequest(
    table,
    method = "GET",
    data = null,
    query = ""
){

    const url =
        SUPABASE_URL +
        "/rest/v1/" +
        table +
        query;


    const options = {

        method:method,

        headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":"application/json",
            "Prefer":"return=representation"
        }

    };


    if(data !== null){

        options.body =
            JSON.stringify(data);

    }


    console.log(
        "ARTISTVIDEOS → Supabase:",
        url
    );


    try{

        const response =
            await fetch(
                url,
                options
            );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                errorText
            );

        }


        const text =
            await response.text();


        if(!text){

            return [];

        }


        try{

            return JSON.parse(text);

        }catch(jsonError){

            console.error(
                "Respuesta no válida:",
                text
            );

            throw new Error(
                "Supabase devolvió una respuesta no válida."
            );

        }


    }catch(error){

        console.error(
            "ERROR SUPABASE:",
            error
        );

        throw error;

    }

}

/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if(
        password !==
        ADMIN_PASSWORD
    ){

        document.getElementById(
            "loginError"
        ).style.display =
            "block";

        return;

    }


    document.getElementById(
        "loginError"
    ).style.display =
        "none";


    try{

        setConnectionStatus(
            "🔄 Conectando con Supabase..."
        );


        await loadAll();


        sessionStorage.setItem(
            "av_admin_login",
            "true"
        );


        document.getElementById(
            "loginScreen"
        ).style.display =
            "none";


        document.getElementById(
            "adminPanel"
        ).style.display =
            "block";


        renderAll();


        setConnectionStatus(
            "🟢 Supabase conectado correctamente",
            "ok"
        );


    }catch(error){

        console.error(error);


        setConnectionStatus(
            "🔴 Error de conexión con Supabase",
            "error"
        );


        alert(
            "❌ NO SE PUDO CONECTAR CON SUPABASE\n\n" +
            error.message +
            "\n\n" +
            "Revisa la URL y la Clave Publicable de Supabase."
        );

    }

}

    sessionStorage.removeItem(

    location.reload();

}


/* =====================================================
   CARGAR TODO
===================================================== */

async function loadAll(){

    setConnectionStatus(
        "🔄 Cargando artistas..."
    );


    const artistData =
        await supabaseRequest(
            "artists",
            "GET",
            null,
            "?select=*&order=created_at.asc"
        );


    /*
       Si todavía no existen artistas
       en Supabase, se cargan los iniciales.
    */

    if(
        !artistData ||
        artistData.length === 0
    ){

        await seedInitialArtists();

    }


    const finalArtists =
        await supabaseRequest(
            "artists",
            "GET",
            null,
            "?select=*&order=created_at.asc"
        );


    artists =
        (
            finalArtists || []
        ).map(
            normalizeArtist
        );


    setConnectionStatus(
        "🔄 Cargando videos..."
    );


    const videoData =
        await supabaseRequest(
            "videos",
            "GET",
            null,
            "?select=*&order=created_at.asc"
        );


    videos =
        (
            videoData || []
        ).map(
            normalizeVideo
        );


    setConnectionStatus(
        "🟢 Supabase conectado correctamente",
        "ok"
    );

}

/* =====================================================
   NORMALIZAR ARTISTA
===================================================== */

function normalizeArtist(
    artist
){

    return {

        id:
            artist.id,

        name:
            artist.name || "",

        description:
            artist.description || "",

        image:
            artist.image || "",

        facebook:
            artist.facebook || "",

        instagram:
            artist.instagram || "",

        tiktok:
            artist.tiktok || "",

        youtube:
            artist.youtube || "",

        createdAt:
            artist.created_at || ""

    };

}


/* =====================================================
   NORMALIZAR VIDEO
===================================================== */

function normalizeVideo(
    video
){

    return {

        id:
            video.id,

        artistId:
            video.artist_id,

        title:
            video.title || "",

        url:
            video.youtube_url || "",

        description:
            video.description || "",

        category:
            video.category || "",

        popular:
            !!video.popular,

        newRelease:
            !!video.new_release,

        exclusive:
            !!video.exclusive,

        featured:
            !!video.featured,

        createdAt:
            video.created_at || ""

    };

}

   TABS
===================================================== */

function showTab(
    id,
    button
){

    document
        .querySelectorAll(
            ".section"
        )
        .forEach(
            section => {

                section.classList.remove(
                    "active"
                );

            }
        );


    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            tab => {

                tab.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(id)
        .classList.add(
            "active"
        );


    button.classList.add(
        "active"
    );

}

async function updateArtist(){

    const id =
        document.getElementById(
            "editArtistId"
        ).value;


    if(!id) return;


    const updates = {

        name:
            document.getElementById(
                "editArtistName"
            ).value.trim(),

        image:
            document.getElementById(
                "editArtistImage"
            ).value.trim(),

        description:
            document.getElementById(
                "editArtistDescription"
            ).value.trim(),

        facebook:
            document.getElementById(
                "editFacebook"
            ).value.trim(),

        instagram:
            document.getElementById(
                "editInstagram"
            ).value.trim(),

        tiktok:
            document.getElementById(
                "editTikTok"
            ).value.trim(),

        youtube:
            document.getElementById(
                "editArtistYoutube"
            ).value.trim()

    };


    if(!updates.name){

        alert(
            "El nombre del artista es obligatorio."
        );

        return;

    }


    try{

        await supabaseRequest(
            "artists",
            "PATCH",
            updates,
            "?id=eq." +
            encodeURIComponent(id)
        );


        closeModal(
            "editArtistModal"
        );


        await loadAll();


        renderAll();


        alert(
            "✅ Artista actualizado."
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ No se pudo actualizar el artista.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   ELIMINAR ARTISTA
===================================================== */

async function deleteArtist(
    id
){

    const artist =
        artists.find(
            a => a.id === id
        );


    if(!artist) return;


    const confirmDelete =
        confirm(
            "¿Eliminar a " +
            artist.name +
            "?\n\n" +
            "También se eliminarán sus videos."
        );


    if(!confirmDelete) return;


    try{

        await supabaseRequest(
            "artists",
            "DELETE",
            null,
            "?id=eq." +
            encodeURIComponent(id)
        );


        await loadAll();


        renderAll();


        alert(
            "🗑️ Artista eliminado."
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ No se pudo eliminar el artista.\n\n" +
            error.message
        );

    }

}

/* =====================================================
   SELECT DE ARTISTAS
===================================================== */

function populateArtistSelects(){

    const selects = [

        document.getElementById(
            "videoArtist"
        ),

        document.getElementById(
            "editVideoArtist"
        )

    ];


    selects.forEach(
        select => {

            if(!select) return;


            const current =
                select.value;


            select.innerHTML =
                '<option value="">Seleccionar artista</option>';


            artists
                .slice()
                .sort(
                    (a,b) =>
                        a.name.localeCompare(
                            b.name,
                            "es"
                        )
                )
                .forEach(
                    artist => {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            artist.id;


                        option.textContent =
                            artist.name;


                        select.appendChild(
                            option
                        );

                    }
                );


            if(current){

                select.value =
                    current;

            }

        }
    );

}

        document.getElementById(
            "editVideoTitle"
        ).value.trim();


    const url =
        document.getElementById(
            "editVideoUrl"
        ).value.trim();


    const category =
        document.getElementById(
            "editVideoCategory"
        ).value;


    if(!artistId){

        alert(
            "Selecciona un artista."
        );

        return;

    }


    if(!title){

        alert(
            "Escribe el título del video."
        );

        return;

    }


    if(!url){

        alert(
            "Ingresa el link del video."
        );

        return;

    }


    if(!category){

        alert(
            "Selecciona una categoría."
        );

        return;

    }


    const updates = {

        artist_id:
            artistId,

        title:
            title,

        youtube_url:
            url,

        description:
            document.getElementById(
                "editVideoDescription"
            ).value.trim(),

        category:
            category,

        popular:
            document.getElementById(
                "editPopular"
            ).checked,

        new_release:
            document.getElementById(
                "editNew"
            ).checked,

        exclusive:
            document.getElementById(
                "editExclusive"
            ).checked,

        featured:
            document.getElementById(
                "editFeatured"
            ).checked

    };


    try{

        await supabaseRequest(
            "videos",
            "PATCH",
            updates,
            "?id=eq." +
            encodeURIComponent(id)
        );


        closeModal(
            "editVideoModal"
        );


        await loadAll();


        renderAll();


        alert(
            "✅ Video actualizado."
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ No se pudo actualizar el video.\n\n" +
            error.message
        );

    }

}


/* =====================================================
   ELIMINAR VIDEO
===================================================== */

async function deleteVideo(
    id
){

    const video =
        videos.find(
            v => v.id === id
        );


    if(!video) return;


    const confirmDelete =
        confirm(
            "¿Seguro que quieres eliminar este video?\n\n" +
            video.title
        );


    if(!confirmDelete) return;


    try{

        await supabaseRequest(
            "videos",
            "DELETE",
            null,
            "?id=eq." +
            encodeURIComponent(id)
        );


        await loadAll();


        renderAll();


        alert(
            "🗑️ Video eliminado."
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ No se pudo eliminar el video.\n\n" +
            error.message
        );

    }

}

/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return String(
        value || ""
    )
    .replace(
        /"/g,
        "%22"
    )
    .replace(
        /'/g,
        "%27"
    );

}

}


/* =====================================================
   INICIO
===================================================== */

async function startAdmin(){

    const logged =
        sessionStorage.getItem(
            "av_admin_login"
        );


    if(
        logged !== "true"
    ){

        return;

    }


    try{

        document.getElementById(
            "loginScreen"
        ).style.display =
            "none";


        document.getElementById(
            "adminPanel"
        ).style.display =
            "block";


        setConnectionStatus(
            "🔄 Conectando con Supabase..."
        );


        await loadAll();


        renderAll();


        setConnectionStatus(
            "🟢 Supabase conectado correctamente",
            "ok"
        );


    }catch(error){

        console.error(error);


        sessionStorage.removeItem(
            "av_admin_login"
        );


        document.getElementById(
            "loginScreen"
        ).style.display =
            "flex";


        document.getElementById(
            "adminPanel"
        ).style.display =
            "none";


        alert(
            "❌ No se pudo conectar con Supabase.\n\n" +
            error.message
        );

    }

}


startAdmin();
